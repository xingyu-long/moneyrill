name: Bug report
description: Something does not work as described
body:
  - type: markdown
    attributes:
      value: |
        Please **do not paste real financial data, tokens, keys or screenshots showing your balances**. Use demo data or blur/replace numbers.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally reproducible with the demo data (`./scripts/deploy.sh staging`).
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or tag shown in the page footer
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [Staging / demo (Plaid Sandbox), Production (real Plaid), Manual accounts only]
  - type: input
    id: platform
    attributes:
      label: OS, Docker version, browser
