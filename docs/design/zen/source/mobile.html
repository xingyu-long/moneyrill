    <script>
      // Fake data shared by every mockup. Nothing here is real.
      window.MR = {
        net: '$303,390.40',

        change: '+$4,812.27',

        owned: '$331,204.11',

        kept: '$2,709.64',
        rate: 32,
        portfolio: '$186,540.92',
        portfolioChg: '+2.84%',
        kinds: [
          ['Cash', 4, '$42,180.55', 13],
          ['Investments', 3, '$286,540.92', 87],
          ['Credit cards', 2, '-$3,963.71', 14],
          ['Loans', 1, '-$23,850.00', 86],
        ],
        holdings: [
          ['VTI', 'Vanguard Total Stock', '$92,410.10', '+3.1%'],
          ['AAPL', 'Apple Inc.', '$31,882.40', '+5.4%'],
          ['BND', 'Vanguard Total Bond', '$18,220.75', '-0.4%'],
        ],
        categories: [
          ['🏠', 'Housing', '$2,100.00', 37],
          ['🛒', 'Groceries', '$862.14', 15],
          ['🍜', 'Dining out', '$640.80', 11],
          ['🚗', 'Transport', '$410.22', 7],
          ['🛍️', 'Shopping', '$381.95', 7],
        ],
        tx: [
          ['Whole Foods Market', 'Oct 5', 'Groceries', '-$84.12', '🛒', false],
          ['Acme Corp Payroll', 'Oct 4', 'Income', '+$4,210.00', '💼', false],
          ['Amazon', 'Oct 4', 'Shopping', '-$62.99', '📦', true],
          ['Blue Bottle Coffee', 'Oct 3', 'Dining out', '-$6.50', '☕', false],
          ['Shell', 'Oct 2', 'Transport', '-$48.20', '⛽', false],
          ['Netflix', 'Oct 1', 'Subscriptions', '-$15.49', '🎬', false],
        ],
        months: ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'],
        monthIn: [7.9, 8.1, 8.4, 8.0, 8.6, 8.4],
        monthOut: [6.2, 5.4, 6.8, 5.9, 5.1, 5.7],
      };

      // A seeded random walk drawn into a w x h box. Returns {line, area, last:[x,y]}.
      MR.series = function (w, h, opts = {}) {
        const { n = 60, seed = 7, drift = 0.6, vol = 2.2, pad = 4 } = opts;
        let s = seed;
        const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647 - 0.5;
        const ys = [];
        let v = 0;
        for (let i = 0; i < n; i++) {
          v += drift + rnd() * vol * 2;
          ys.push(v);
        }
        const lo = Math.min(...ys),
          hi = Math.max(...ys);
        const pts = ys.map((y, i) => [
          (i / (n - 1)) * w,
          pad + (h - pad * 2) * (1 - (y - lo) / (hi - lo || 1)),
        ]);
        let line = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
        for (let i = 1; i < pts.length; i++) {
          const [x0, y0] = pts[i - 1],
            [x1, y1] = pts[i];
          const cx = (x0 + x1) / 2;
          line += ` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
        }
        return { line, area: `${line} L${w},${h} L0,${h} Z`, last: pts[pts.length - 1] };
      };

      // Fill every <svg data-series="seed,drift,vol"> with paths styled by its data attributes.
      MR.draw = function () {
        document.querySelectorAll('svg[data-series]').forEach((svg) => {
          const [seed, drift, vol] = svg.dataset.series.split(',').map(Number);
          const vb = svg.viewBox.baseVal;
          const s = MR.series(vb.width, vb.height, {
            seed,
            drift,
            vol,
            n: Number(svg.dataset.n || 60),
          });
          const ns = 'http://www.w3.org/2000/svg';
          if (svg.dataset.fill) {
            const a = document.createElementNS(ns, 'path');
            a.setAttribute('d', s.area);
            a.setAttribute('fill', svg.dataset.fill);
            svg.appendChild(a);
          }
          const l = document.createElementNS(ns, 'path');
          l.setAttribute('d', s.line);
          l.setAttribute('fill', 'none');
          l.setAttribute('stroke', svg.dataset.stroke || 'currentColor');
          l.setAttribute('stroke-width', svg.dataset.width || '2');
          l.setAttribute('vector-effect', 'non-scaling-stroke');
          l.setAttribute('stroke-linecap', 'round');
          svg.appendChild(l);
          if (svg.dataset.dot) {
            const c = document.createElementNS(ns, 'circle');
            c.setAttribute('cx', s.last[0]);
            c.setAttribute('cy', s.last[1]);
            c.setAttribute('r', svg.dataset.dot);
            c.setAttribute('fill', svg.dataset.stroke || 'currentColor');
            svg.appendChild(c);
          }
        });
      };
      // Render a template with MR in scope into #app.
      MR.render = function (fn) {
        document.getElementById('app').innerHTML = fn(MR);
        MR.draw();
      };
    </script>
    <script>
      const [BOARD, THEME] = (location.hash.slice(1) || '1').split(',');
      if (THEME == 'dark') document.documentElement.className = 'dark';
      const DK = THEME == 'dark',
        sage = DK ? '#93b59b' : '#5b7a62',
        clay = DK ? '#d79c7d' : '#c98b6b';
      const CC = {
        Housing: 'var(--c-housing)',
        Groceries: 'var(--c-groceries)',
        'Dining out': 'var(--c-dining)',
        Transport: 'var(--c-transport)',
        Shopping: 'var(--c-shopping)',
        Subscriptions: 'var(--c-subs)',
        Income: 'var(--c-income)',
      };
      const tint = (c) => `color-mix(in srgb,${c} 16%,transparent)`;
      const icons = {
        Home: 'M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z',
        Accounts: 'M3 9l9-5 9 5M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18',
        Activity: 'M5 6h14M5 12h14M5 18h9',
        Invest: 'M3 17l6-6 4 4 8-8M15 7h6v6',
        Reports: 'M5 20V11M12 20V4M19 20v-6',
      };
      const tabs = (on) =>

          .map(
            (k) =>
              `<div class="tab ${k == on ? 'on' : ''}"><svg viewBox="0 0 24 24"><path d="${icons[k]}"/></svg><span>${k}</span></div>`,
          )
          .join('')}</div>`;
      const sig =

      const phone = (cap, body) =>
        `<div class="wrap"><div class="phone"><div class="island"></div><div class="sb"><span>9:41</span><span class="r">${sig} 5G <span class="batt"><i></i></span></span></div>${body}<div class="home"></div></div><div class="cap">${cap}</div></div>`;
      const area = (seed, h, id, c = sage, o = {}) =>
        `<svg viewBox="0 0 360 ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block" data-series="${seed},${o.drift || 0.5},${o.vol || 1.6}" data-n="${o.n || 40}" data-stroke="${c}" data-fill="url(#${id})" data-width="2.5"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${c}" stop-opacity=".22"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs></svg>`;
      const txr = (t, acct) =>
        `<div class="row"><div class="dot" style="background:${tint(CC[t[2]])}">${t[4]}</div><div class="n"><span>${t[0]}${t[5] ? '<span class="pend">pending</span>' : ''}</span><small>${t[2]}${acct ? ' · ' + acct : ''}</small></div><span class="num ${t[3][0] == '+' ? 'up' : ''}">${t[3]}</span></div>`;

      const S = {
        home: (m) =>
