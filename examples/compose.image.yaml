# Run Moneyrill from the published container image, without cloning the source or building anything.
# See "Run the published image" in docs/development/OPERATIONS.md.
#
#   mkdir moneyrill && cd moneyrill && curl -O <raw URL of this file>
#   openssl rand -hex 32 > token.key && chmod 600 token.key
#   MONEYRILL_VERSION=0.1.0 docker compose -f compose.image.yaml up -d
#   open http://localhost:3002        (STAGING_PORT in the environment or a .env next to this file changes the port)
#
# This is the demo setup: simulated data and Plaid Sandbox. Keep token.key: it encrypts the bank tokens, and
# the data in the database volume is unreadable without it.
name: moneyrill-image
services:
  db:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneyrill
      POSTGRES_USER: moneyrill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      retries: 20
  app:
    restart: unless-stopped
    image: ghcr.io/xingyu-long/moneyrill:${MONEYRILL_VERSION:?Set MONEYRILL_VERSION to a released version, e.g. 0.1.0}
    ports: ['127.0.0.1:${STAGING_PORT:-3002}:3002'] # loopback only: do not publish this to the internet
    environment:
      DATABASE_URL: postgres://moneyrill:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/moneyrill
      APP_ENV: staging
      PLAID_ENV: sandbox
      PUBLIC_ORIGIN: http://localhost:${STAGING_PORT:-3002}
      KEY_FILE: /run/secrets/token_key
      PORT: 3002
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
    secrets: [token_key]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      retries: 10
  worker:
    restart: unless-stopped
    image: ghcr.io/xingyu-long/moneyrill:${MONEYRILL_VERSION:?Set MONEYRILL_VERSION to a released version, e.g. 0.1.0}
    command: [npm, run, worker]
    environment:
      DATABASE_URL: postgres://moneyrill:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/moneyrill
      APP_ENV: staging
      PLAID_ENV: sandbox
      PUBLIC_ORIGIN: http://localhost:${STAGING_PORT:-3002}
      KEY_FILE: /run/secrets/token_key
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
    secrets: [token_key]
    depends_on:
      app: { condition: service_healthy }
volumes:
  database:
secrets:
  token_key:
    file: ./token.key
